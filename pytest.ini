[pytest]
asyncio_mode = auto
markers =
    live: tests that require live services (Ollama, llama-server). They self-skip if unreachable.
    interop: interoperability tests against independent DICOM tools (dcmtk, Orthanc); skipped when absent.
    device(vendor, service): which vendor behaviour and DICOM service an interop test reproduces (compatibility matrix).
testpaths = tests backend/tests
pythonpath = . src backend
addopts = -v --tb=short --import-mode=importlib
