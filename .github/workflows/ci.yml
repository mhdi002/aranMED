name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  # CPU wheels keep CI small; production images install CUDA builds.
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install "ruff>=0.6"
      - run: ruff check backend tests src scripts/docs
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Install Python dependencies
        run: |
          pip install torch torchaudio --index-url "$TORCH_INDEX"
          pip install -r requirements-dev.txt -r requirements-medrag.txt
      - name: Tests (SQLite) with coverage
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=pytest-sqlite.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-reports, path: "pytest-sqlite.xml\ncoverage.xml" }

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: aranmed_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG: postgresql://postgres:postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - run: |
          pip install torch torchaudio --index-url "$TORCH_INDEX"
          pip install -r requirements-dev.txt
      - name: Backend suite on PostgreSQL
        run: DATABASE_URL="$PG/aranmed_test" pytest --ignore=tests/medrag --junitxml=pytest-postgres.xml
      - name: Mixed network (one hospital on PostgreSQL, the others on SQLite)
        run: >
          HOSPITAL_PG_DSN_BASE="$PG" HOSPITAL_PG_OIDS=2.25.702,2.25.602
          pytest tests/functional/test_interhospital.py tests/functional/test_interhospital_records.py
          --junitxml=pytest-mixed-network.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: postgres-reports, path: "pytest-*.xml" }

  interop-devices:
    # AranMed's DICOM services against independent implementations (dcmtk,
    # Orthanc) emulating vendor device profiles, plus a real-file corpus.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dcmtk orthanc ffmpeg libsndfile1
      - run: |
          pip install torch torchaudio --index-url "$TORCH_INDEX"
          pip install -r requirements-dev.txt
      - name: Real-file corpus (pydicom-data)
        run: git clone --depth 1 https://github.com/pydicom/pydicom-data.git /tmp/pydicom-data
      - name: Interop suite
        env:
          DICOM_CORPUS_DIR: /tmp/pydicom-data/data_store/data
          INTEROP_MATRIX_OUT: device-compatibility.md
        run: pytest tests/interop_devices --junitxml=pytest-interop-devices.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: interop-reports, path: "pytest-interop-devices.xml\ndevice-compatibility.md" }

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1
      - name: Python dependencies for the E2E stack
        run: |
          python -m venv .venv
          .venv/bin/pip install torch torchaudio --index-url "$TORCH_INDEX"
          .venv/bin/pip install -r requirements-dev.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Playwright (functional, accessibility)
        run: npx playwright test --reporter=list
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-results, path: frontend/test-results }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the frontend image (the CUDA backend image is built on GPU hosts)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
