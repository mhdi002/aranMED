# =============================================================================
# AranMed — full stack, single command.
#
#   cp .env.example .env      # then set MEDRAG_QDRANT_STORAGE to your corpus
#   docker compose up -d --build
#
# Brings up: gateway (load balancer) → frontend + backend → medrag → qdrant.
# Every image installs its own dependencies at build time; no manual pip/npm.
#
# Profiles (opt-in extras, none required for the core stack):
#   --profile ollama      run Ollama in-compose instead of pointing at a host
#   --profile vllm        GPU generation server (OpenAI-compatible)
#   --profile vllm-embed  GPU embedding server
#
# Scale horizontally (the gateway discovers replicas via Docker DNS):
#   docker compose up -d --scale backend=4 --scale medrag=3 --scale frontend=2
#
# Nothing below hardcodes a host, port, path, or model — every value is an
# environment variable with a documented default. See docs/core/CONFIGURATION.md
# =============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"

x-gpu: &gpu-reservation
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: ${GPU_COUNT:-all}
          capabilities: [gpu]

services:
  # ── Public entrypoint / load balancer ──────────────────────────────────────
  gateway:
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    depends_on:
      - backend
      - frontend
    environment:
      # Rendered into the config by nginx's envsubst entrypoint.
      GATEWAY_PORT: "${GATEWAY_PORT:-8080}"
      BACKEND_HOST: "${BACKEND_SERVICE:-backend}"
      BACKEND_PORT: "${BACKEND_PORT:-8010}"
      FRONTEND_HOST: "${FRONTEND_SERVICE:-frontend}"
      FRONTEND_PORT: "${FRONTEND_PORT:-3000}"
      LB_KEEPALIVE: "${LB_KEEPALIVE:-64}"
      LB_MAX_FAILS: "${LB_MAX_FAILS:-3}"
      LB_FAIL_TIMEOUT: "${LB_FAIL_TIMEOUT:-15s}"
      LB_CONNECT_TIMEOUT: "${LB_CONNECT_TIMEOUT:-10s}"
      LB_SEND_TIMEOUT: "${LB_SEND_TIMEOUT:-600s}"
      LB_READ_TIMEOUT: "${LB_READ_TIMEOUT:-600s}"
      LB_HEALTH_TIMEOUT: "${LB_HEALTH_TIMEOUT:-10s}"
      LB_MAX_BODY_SIZE: "${LB_MAX_BODY_SIZE:-256m}"
      LB_NEXT_UPSTREAM_TRIES: "${LB_NEXT_UPSTREAM_TRIES:-3}"
      LB_AI_RATE: "${LB_AI_RATE:-30r/s}"
      LB_AI_BURST: "${LB_AI_BURST:-200}"
      LB_MAX_CONN_PER_IP: "${LB_MAX_CONN_PER_IP:-100}"
      LB_RATE_ZONE_SIZE: "${LB_RATE_ZONE_SIZE:-16m}"
      # --- TLS (off by default; see docs/core/DEPLOYMENT.md) ----------------
      # Set GATEWAY_TLS_ENABLED=1 and mount a cert/key to terminate HTTPS at
      # the gateway. With it off, everything below is inert and the gateway
      # serves plain HTTP exactly as before.
      GATEWAY_TLS_ENABLED: "${GATEWAY_TLS_ENABLED:-0}"
      GATEWAY_TLS_PORT: "${GATEWAY_TLS_PORT:-8443}"
      GATEWAY_TLS_PUBLISH_PORT: "${GATEWAY_TLS_PUBLISH_PORT:-8443}"
      GATEWAY_TLS_CERT: "${GATEWAY_TLS_CERT:-/etc/nginx/certs/tls.crt}"
      GATEWAY_TLS_KEY: "${GATEWAY_TLS_KEY:-/etc/nginx/certs/tls.key}"
      GATEWAY_TLS_PROTOCOLS: "${GATEWAY_TLS_PROTOCOLS:-TLSv1.2 TLSv1.3}"
      GATEWAY_TLS_CIPHERS: "${GATEWAY_TLS_CIPHERS:-ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305}"
      GATEWAY_TLS_SESSION_CACHE: "${GATEWAY_TLS_SESSION_CACHE:-10m}"
      GATEWAY_TLS_SESSION_TIMEOUT: "${GATEWAY_TLS_SESSION_TIMEOUT:-1d}"
      GATEWAY_HSTS_MAX_AGE: "${GATEWAY_HSTS_MAX_AGE:-31536000}"
      # Scheme the gateway uses to reach the upstreams. Default http: they sit
      # on a private compose network behind the terminator. Set to https (with
      # BACKEND_TLS_ENABLED=1 on the backend) when that network is not trusted
      # — see docs/core/SECURITY.md.
      BACKEND_UPSTREAM_SCHEME: "${BACKEND_UPSTREAM_SCHEME:-http}"
      FRONTEND_UPSTREAM_SCHEME: "${FRONTEND_UPSTREAM_SCHEME:-http}"
      # Only substitute our own knobs; leave nginx's own $variables intact.
      NGINX_ENVSUBST_FILTER: "^(GATEWAY_|BACKEND_|FRONTEND_|LB_)"
    volumes:
      # Mounted as a source directory; 10-aranmed-tls.sh stages the template
      # into /etc/nginx/templates (optionally rewriting it for TLS) before
      # nginx's own envsubst pass runs.
      - ./deploy/nginx/nginx.conf.template:/etc/nginx/aranmed/nginx.conf.template:ro
      - ./deploy/nginx/10-aranmed-tls.sh:/docker-entrypoint.d/10-aranmed-tls.sh:ro
      - ${GATEWAY_TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/nginx/certs:ro
    # Lets BACKEND_SERVICE/FRONTEND_SERVICE point at host.docker.internal when
    # an upstream runs outside the compose network (e.g. a natively installed
    # backend during a partial rollout). See docs/core/DEPLOYMENT.md.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # The HTTPS port is published by docker-compose.tls.yml, not here, so a
      # non-TLS deployment never binds a host port nothing listens on.
      - "${GATEWAY_PUBLISH_PORT:-8080}:${GATEWAY_PORT:-8080}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${GATEWAY_PORT:-8080}/healthz"]
      interval: "${HEALTHCHECK_INTERVAL:-15s}"
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  # ── aranmed backend (ASR + reporting + rules + EHR) ───────────────────────
  backend:
    build:
      context: .
      target: backend
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    env_file: [.env]
    environment:
      HOST: "0.0.0.0"
      PORT: "${BACKEND_PORT:-8010}"
      HF_HOME: "${DOCKER_HF_HOME:-/models}"
      # Service discovery inside the compose network.
      OLLAMA_HOST: "${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}"
      MEDRAG_API_URL: "${DOCKER_MEDRAG_API_URL:-http://medrag:8080}"
      # whisper-triton is additive (disabled by default in models.docker.yaml
      # unless TRITON_ENABLED_DEFAULT=true) -- but its URL must resolve inside
      # the container regardless, since a bare 127.0.0.1 there means "this
      # container", not any Triton server. Points at the compose `triton`
      # service by default; override if you run a native/external one.
      TRITON_URL: "${DOCKER_TRITON_URL:-http://triton:8002}"
      ASR_AGENT_REGISTRY_YAML: "${DOCKER_REGISTRY_YAML:-/app/backend/models.yaml}"
      # Encrypt the gateway->backend hop too. Requires a cert/key mounted
      # below and BACKEND_UPSTREAM_SCHEME=https on the gateway. Off by
      # default; see docs/core/SECURITY.md.
      BACKEND_TLS_ENABLED: "${BACKEND_TLS_ENABLED:-0}"
      BACKEND_TLS_CERT: "${BACKEND_TLS_CERT:-/etc/aranmed/certs/tls.crt}"
      BACKEND_TLS_KEY: "${BACKEND_TLS_KEY:-/etc/aranmed/certs/tls.key}"
      # PHI encryption at rest (backend/phi_crypto.py). Unset = data stored
      # in the clear and a warning logged on first write.
      PHI_ENCRYPTION_KEYS: "${PHI_ENCRYPTION_KEYS:-}"
      PHI_ENCRYPTION_KEY_FILE: "${PHI_ENCRYPTION_KEY_FILE:-}"
      # Unset = SQLite (the default). Set to a postgresql:// DSN to lift the
      # single-writer ceiling; with the `postgres` profile running, that is
      # postgresql://aranmed:aranmed@postgres:5432/aranmed
      DATABASE_URL: "${DATABASE_URL:-}"
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-2192}"
      TERMINOLOGY_SERVER_URL: "${TERMINOLOGY_SERVER_URL:-}"
      # Core-LLM topology. Default is Ollama; set VLLM_CORE_ENABLED=true and
      # OLLAMA_ENABLED=false to serve the core model from vLLM instead. The
      # registry reads these, so the same image serves either arrangement.
      OLLAMA_ENABLED: "${OLLAMA_ENABLED:-true}"
      OLLAMA_DEFAULT: "${OLLAMA_DEFAULT:-true}"
      VLLM_CORE_ENABLED: "${VLLM_CORE_ENABLED:-false}"
      VLLM_CORE_DEFAULT: "${VLLM_CORE_DEFAULT:-false}"
      VLLM_MODEL: "${VLLM_MODEL:-}"
      VLLM_API_KEY: "${VLLM_API_KEY:-EMPTY}"
      DOCKER_VLLM_BASE_URL: "${DOCKER_VLLM_BASE_URL:-http://vllm:8000/v1}"
      # ASR topology. Default is in-process Whisper (hf_asr); flip these to
      # serve it from the Triton container instead, which keeps the model out
      # of the API process and lets ASR scale on its own.
      ASR_HF_ENABLED: "${ASR_HF_ENABLED:-true}"
      ASR_HF_DEFAULT: "${ASR_HF_DEFAULT:-true}"
      ASR_TRITON_ENABLED: "${ASR_TRITON_ENABLED:-true}"
      ASR_TRITON_DEFAULT: "${ASR_TRITON_DEFAULT:-false}"
    volumes:
      - hf-cache:${DOCKER_HF_HOME:-/models}
      - ./backend/models.docker.yaml:/app/backend/models.yaml:ro
      - ./backend/data:/app/backend/data
      - ${GATEWAY_TLS_CERT_DIR:-./deploy/nginx/certs}:/etc/aranmed/certs:ro
      # Pre-downloaded weights snapshot (e.g. models/whisper-large-v3/...).
      # backend/providers/hf_asr.py::_resolve_model_source already checks
      # <project_root>/models/<repo-name> before hitting the network — this
      # just makes that directory visible inside the container. Point
      # LOCAL_MODELS_DIR elsewhere if your snapshots live outside the repo;
      # defaults to the host ./models used by the native (non-Docker) run.
      - ${LOCAL_MODELS_DIR:-./models}:/app/models:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "${BACKEND_PORT:-8010}"
    healthcheck:
      # -k because an internal cert is typically self-signed/private-CA; the
      # probe is loopback inside the container, so it is authenticating
      # nothing either way. Scheme follows BACKEND_TLS_ENABLED.
      # $$ escapes the substitution so the *container's* runtime value is read.
      # A single $ would be interpolated by Compose at parse time, which never
      # sees BACKEND_TLS_ENABLED set by the internal-tls overlay — the probe
      # would then speak HTTP to an HTTPS listener and report unhealthy.
      test: ["CMD-SHELL", "if [ \"$${BACKEND_TLS_ENABLED:-0}\" = \"1\" ]; then curl -skf \"https://127.0.0.1:$${PORT:-8010}/api/health\"; else curl -sf \"http://127.0.0.1:$${PORT:-8010}/api/health\"; fi"]
      interval: "${HEALTHCHECK_INTERVAL:-30s}"
      timeout: 10s
      retries: 5
      start_period: "${BACKEND_START_PERIOD:-180s}"
    deploy:
      <<: *gpu-reservation
      replicas: ${BACKEND_REPLICAS:-1}
    restart: unless-stopped
    logging: *default-logging

  # ── Triton-compatible ASR service (the whisper-triton provider) ───────────
  # Additive: hf_asr in the backend container stays the default ASR path.
  # This gives the "asr" role a second, independent worker pool (selectable
  # via model=whisper-triton) for capacity beyond a single hf_asr instance --
  # e.g. run it on CPU while GPU hf_asr handles the primary load, or scale
  # both independently under concurrent transcription requests.
  #
  # Reuses the `backend` image/build (already has torch/transformers/CUDA)
  # with a different entrypoint instead of a third multi-GB image: the real
  # nvcr.io/nvidia/tritonserver image requires an NGC login this environment
  # doesn't have, so this runs deploy/triton/compat_http_server.py, which
  # speaks the same HTTP v2 subset backend/providers/triton_asr.py expects.
  triton:
    build:
      context: .
      target: backend
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    volumes:
      - ./deploy:/app/deploy:ro
      - hf-cache:${DOCKER_HF_HOME:-/models}
      - ${LOCAL_MODELS_DIR:-./models}:/app/models:ro
    working_dir: /app
    environment:
      PYTHONPATH: "/app/backend"
      HF_HOME: "${DOCKER_HF_HOME:-/models}"
      TRITON_COMPAT_HOST: "0.0.0.0"
      TRITON_COMPAT_PORT: "${TRITON_COMPAT_PORT:-8002}"
      # Local snapshot mounted above (see backend's LOCAL_MODELS_DIR comment);
      # falls back to the HF hub id if not present.
      WHISPER_MODEL_DIR: "${DOCKER_WHISPER_MODEL_DIR:-/app/models/whisper-large-v3}"
      # Used when the path above holds no weights — which is the normal case
      # on a host that never pre-downloaded a snapshot and relies on the
      # shared hf-cache volume instead.
      WHISPER_HUB_MODEL_ID: "${WHISPER_HUB_MODEL_ID:-openai/whisper-large-v3}"
      # CPU by default: the GPU is already shared by backend's hf_asr and
      # medrag's local embeddings on an 8GB card. Set cuda if you have VRAM
      # to spare and want this replica to genuinely add throughput, not just
      # redundancy.
      WHISPER_DEVICE: "${TRITON_WHISPER_DEVICE:-cpu}"
      WHISPER_WARMUP: "${TRITON_WHISPER_WARMUP:-0}"
      WHISPER_TARGET_SR: "16000"
      WHISPER_OUTPUT_ENGLISH: "${WHISPER_OUTPUT_ENGLISH:-1}"
      WHISPER_MAX_SHORTFORM_S: "${WHISPER_MAX_SHORTFORM_S:-30}"
      WHISPER_CHUNK_LENGTH_S: "${WHISPER_CHUNK_LENGTH_S:-30}"
    command: ["python", "/app/deploy/triton/compat_http_server.py"]
    expose:
      - "${TRITON_COMPAT_PORT:-8002}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${TRITON_COMPAT_PORT:-8002}/v2/health/ready"]
      interval: "${HEALTHCHECK_INTERVAL:-30s}"
      timeout: 10s
      retries: 5
      start_period: "${TRITON_START_PERIOD:-180s}"
    restart: unless-stopped
    logging: *default-logging

  # ── MedicalRAG knowledge engine ───────────────────────────────────────────
  medrag:
    build:
      context: .
      target: medrag
      args:
        MEDRAG_TORCH_INDEX: ${MEDRAG_TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    env_file: [.env]
    environment:
      MEDRAG_HOST: "0.0.0.0"
      MEDRAG_PORT: "${MEDRAG_PORT:-8080}"
      MEDRAG_ROOT: "/app"
      HF_HOME: "${DOCKER_HF_HOME:-/models}"
      QDRANT_URL: "${DOCKER_QDRANT_URL:-http://qdrant:6333}"
      MEDRAG_QDRANT_MODE: "server"
      # Only the stores this corpus actually contains (see CONFIGURATION.md).
      MEDRAG_QDRANT_STORES: "${MEDRAG_QDRANT_STORES:-main,standards,expand}"
      MEDRAG_CATALOG_DB: "${DOCKER_MEDRAG_CATALOG_DB:-/app/corpus/catalog.db}"
      MEDRAG_DATA_DIR: "${DOCKER_MEDRAG_DATA_DIR:-/app/corpus/data}"
      OLLAMA_HOST: "${DOCKER_OLLAMA_HOST:-http://host.docker.internal:11434}"
      # This image ships CPU torch, so embeddings/reranking run in-process on
      # CPU by default. Point these at a GPU vLLM server (profile: vllm-embed)
      # for production throughput — see docs/core/DEPLOYMENT.md.
      MEDRAG_EMBED_PROVIDER: "${DOCKER_MEDRAG_EMBED_PROVIDER:-local}"
      MEDRAG_EMBED_DEVICE: "${DOCKER_MEDRAG_EMBED_DEVICE:-cpu}"
      MEDRAG_RERANK_DEVICE: "${DOCKER_MEDRAG_RERANK_DEVICE:-cpu}"
      # Provider and model must agree: MEDRAG_LLM_MODEL in .env names a
      # vLLM/HuggingFace id (e.g. "Qwen/Qwen3.5-4B"), which Ollama answers
      # with 404. When this container defaults the provider to ollama it must
      # also supply an Ollama *tag*. Defaults to the configured Ollama
      # fallback model. See docs/core/CONFIGURATION.md.
      MEDRAG_LLM_PROVIDER: "${DOCKER_MEDRAG_LLM_PROVIDER:-ollama}"
      MEDRAG_LLM_MODEL: "${DOCKER_MEDRAG_LLM_MODEL:-${MEDRAG_LLM_FALLBACK_MODEL:-}}"
    volumes:
      - hf-cache:${DOCKER_HF_HOME:-/models}
      # The knowledge corpus root: holds catalog.db plus data/ (chunks, OCR
      # text, manifests). Point MEDRAG_CORPUS_DIR at your MedicalRAG install.
      - ${MEDRAG_CORPUS_DIR:-.}:/app/corpus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_started
    expose:
      - "${MEDRAG_PORT:-8080}"
    # Not published by default (the gateway is the entrypoint). Set
    # MEDRAG_PUBLISH_PORT to reach it from the host — useful for debugging or
    # when the backend runs outside the compose network. Incompatible with
    # MEDRAG_REPLICAS>1 (a fixed host port cannot fan out).
    ports:
      - "${MEDRAG_PUBLISH_PORT:-8081}:${MEDRAG_PORT:-8080}"
    healthcheck:
      # /live is dependency-free, so a replica reports healthy as soon as the
      # process is serving; /health (models + Qdrant) is the deeper probe.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${MEDRAG_PORT:-8080}/live"]
      interval: "${HEALTHCHECK_INTERVAL:-30s}"
      timeout: 10s
      retries: 5
      start_period: "${MEDRAG_START_PERIOD:-120s}"
    # Local-CPU embeddings + reranking load two ~2.2 GB models and rerank up
    # to `retrieval.top_k_search` passages. Unbounded, that starves the rest of
    # the stack and the kernel OOM-killer picks an arbitrary victim (observed:
    # the medrag worker was "Killed" mid-request, surfacing to the client as a
    # dropped connection rather than an error). An explicit limit makes the
    # constraint attributable. Raise it, or move embed/rerank onto the GPU via
    # the vllm-embed profile. See docs/core/DEPLOYMENT.md.
    mem_limit: ${MEDRAG_MEM_LIMIT:-6g}
    deploy:
      replicas: ${MEDRAG_REPLICAS:-1}
    restart: unless-stopped
    logging: *default-logging

  # ── Vector database (the real knowledge corpus lives here) ────────────────
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    environment:
      QDRANT__SERVICE__HTTP_PORT: "${QDRANT_HTTP_PORT:-6333}"
      QDRANT__SERVICE__GRPC_PORT: "${QDRANT_GRPC_PORT:-6334}"
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "${QDRANT_SEARCH_THREADS:-0}"
    volumes:
      # Point MEDRAG_QDRANT_STORAGE at your existing corpus to use it as-is.
      - ${MEDRAG_QDRANT_STORAGE:-./qdrant_storage}:/qdrant/storage
    ports:
      - "${QDRANT_PUBLISH_PORT:-6333}:${QDRANT_HTTP_PORT:-6333}"
    healthcheck:
      # The qdrant image ships bash but no curl/wget, so probe the port directly.
      # Qdrant does not bind HTTP until every collection is recovered, so a
      # large corpus (tens of GB) legitimately needs a long start_period —
      # otherwise the container is marked unhealthy while it is simply loading.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/${QDRANT_HTTP_PORT:-6333}'"]
      interval: "${HEALTHCHECK_INTERVAL:-15s}"
      timeout: 5s
      retries: "${QDRANT_HEALTH_RETRIES:-30}"
      start_period: "${QDRANT_START_PERIOD:-900s}"
    restart: unless-stopped
    logging: *default-logging

  # ── Next.js UI ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      target: frontend
    environment:
      HOST: "0.0.0.0"
      PORT: "${FRONTEND_PORT:-3000}"
      NODE_ENV: production
      BACKEND_URL: "${DOCKER_BACKEND_URL:-http://backend:8010}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "${FRONTEND_PORT:-3000}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${FRONTEND_PORT:-3000}/login"]
      interval: "${HEALTHCHECK_INTERVAL:-30s}"
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: ${FRONTEND_REPLICAS:-1}
    restart: unless-stopped
    logging: *default-logging

  # ── Optional: Ollama in-compose (else point DOCKER_OLLAMA_HOST at a host) ──
  # ── Optional: PostgreSQL, when SQLite's single writer becomes the ceiling ──
  # Opt in with `--profile postgres` and set DATABASE_URL. The backend keeps
  # SQLite as its default, so nothing here affects a deployment that doesn't
  # ask for it. See docs/core/CONFIGURATION.md.
  postgres:
    profiles: ["postgres"]
    image: postgres:${POSTGRES_VERSION:-16-alpine}
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-aranmed}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aranmed}"
      POSTGRES_DB: "${POSTGRES_DB:-aranmed}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aranmed} -d $${POSTGRES_DB:-aranmed}"]
      interval: "${HEALTHCHECK_INTERVAL:-30s}"
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PUBLISH_PORT:-11434}:11434"
    deploy: *gpu-reservation
    restart: unless-stopped
    logging: *default-logging

  # ── Optional: GPU generation server (OpenAI-compatible) ───────────────────
  vllm:
    profiles: ["vllm"]
    image: vllm/vllm-openai:${VLLM_VERSION:-latest}
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - "--model"
      - "${VLLM_MODEL}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${VLLM_CONTAINER_PORT:-8000}"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-2048}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.55}"
      # VLLM_QUANTIZATION was documented in .env.example but never reached the
      # container, so setting it did nothing and an unquantised model would
      # OOM on a small card with no clue why. "none" means "let vLLM read the
      # model's own quantization_config", which is right for pre-quantised
      # checkpoints (AWQ/GPTQ) that describe themselves.
      - "--quantization"
      - "${VLLM_QUANTIZATION:-none}"
      # Turing (sm75, e.g. RTX 2080 Ti) has no bfloat16. vLLM warns and falls
      # back on its own, but saying float16 explicitly keeps the log honest
      # and avoids a silent precision change on newer cards.
      - "--dtype"
      - "${VLLM_DTYPE:-auto}"
      # The agent always sends `tools`, and vLLM rejects that with
      # `"auto" tool choice requires --enable-auto-tool-choice and
      # --tool-call-parser to be set` -- a 400 on every report while plain
      # chat still works, which makes it look like a prompt problem rather
      # than a server flag. Tool calling is required for the agent, so it is
      # on; the parser must match the model family (hermes suits Qwen2.5 and
      # Hermes-style models, llama3_json for Llama 3, mistral for Mistral).
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "${VLLM_TOOL_CALL_PARSER:-hermes}"
    ports:
      - "${VLLM_PORT:-8000}:${VLLM_CONTAINER_PORT:-8000}"
    deploy: *gpu-reservation
    restart: unless-stopped
    logging: *default-logging

  # ── Optional: GPU embedding server ────────────────────────────────────────
  vllm-embed:
    profiles: ["vllm-embed"]
    image: vllm/vllm-openai:${VLLM_VERSION:-latest}
    environment:
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
    volumes:
      - hf-cache:/root/.cache/huggingface
    command:
      - "--model"
      - "${VLLM_EMBED_MODEL}"
      # `--task embed` was removed from vLLM; current builds reject it with
      # "unrecognized arguments: --task embed" and the container crash-loops.
      # `--runner pooling` is the replacement (`--convert embed` is the other
      # half of the split, for adapting a generation model to pooling — not
      # needed for a model like bge-m3 that is natively an embedder).
      - "--runner"
      - "${VLLM_EMBED_RUNNER:-pooling}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${VLLM_EMBED_CONTAINER_PORT:-8001}"
      - "--max-model-len"
      - "${VLLM_EMBED_MAX_MODEL_LEN:-512}"
      - "--gpu-memory-utilization"
      - "${VLLM_EMBED_GPU_MEM_UTIL:-0.25}"
    ports:
      - "${VLLM_EMBED_PORT:-8001}:${VLLM_EMBED_CONTAINER_PORT:-8001}"
    deploy: *gpu-reservation
    restart: unless-stopped
    logging: *default-logging

volumes:
  hf-cache:
  ollama:
  pgdata:
